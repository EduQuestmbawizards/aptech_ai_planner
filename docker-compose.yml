version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aptech_planner_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./aptech_planner.db}
    volumes:
      - ./course_data:/app/course_data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aptech_planner_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

